# Bot Ofertas num servidor Linux (DigitalOcean, Hetzner, Oracle...).
#
# Sobe 5 containers: a Evolution API (a ponte com o WhatsApp) e os 4
# processos do bot, os mesmos que o `startup.py` sobe no PC do Daniel.
#
# Rodar:  bash deploy/deploy_vps.sh        (a partir da raiz do repositório)

# ── Base comum aos 4 processos do bot ────────────────────────────────────
# Tudo o que estiver no `.env` chega ao container por `env_file`. A versão
# anterior listava as variáveis uma a uma em `environment:`, e qualquer
# chave nova do `.env` (N8N_TOKEN, ADMIN_CHAT_ID, PUBLICAR_SEM_FOTO,
# HORA_LIGAR...) simplesmente não existia dentro do container: o operador
# editava o `.env`, reiniciava e nada mudava, sem uma linha de erro para
# explicar. `environment:` fica só para o que é DIFERENTE aqui dentro.
x-bot: &bot
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: always
  env_file:
    - ../.env
  environment: &bot-env
    # O nome do serviço resolve na rede do compose — a Evolution não precisa
    # (e não deve) ficar exposta na internet para o bot alcançá-la.
    WHATSAPP_WEBHOOK_URL: http://evolution:8080
    WHATSAPP_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
    WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-botofertas}
    # Fuso do ciclo diário. Ver comentário no Dockerfile: sem isto a janela
    # 08:30–02:00 escorrega 3 horas e o servidor publica por cima do PC.
    TZ: ${TZ:-America/Sao_Paulo}
    # Quem é este publicador (core/papel.py). `nuvem` é o padrão seguro:
    # publica só enquanto o PC local não pode estar publicando. Troque para
    # `nuvem-exclusiva` DEPOIS de calar o PC e o GitHub Actions.
    PAPEL: ${PAPEL:-nuvem}
  volumes:
    - rastreador_data:/app/data
    # O historico do repositorio, so leitura. A imagem nao carrega `.git`
    # (o `.dockerignore` o exclui de proposito — nao se poe credencial de
    # push dentro de uma imagem), mas `core/papel.py` precisa dele para saber
    # se o PC local ainda publica. Sem esta montagem a checagem responde
    # "nao sei" para sempre, e o servidor espera calado por um PC que pode
    # estar fora do ar ha semanas. Leitura apenas: o container nunca commita
    # — quem commita e empurra `docs/` e o servidor, fora do container.
    - ../.git:/app/.git:ro
  depends_on:
    evolution:
      # service_started, não service_healthy: Telegram nunca pode depender
      # do WhatsApp (Regra 6). Se o Evolution falhar ou demorar no
      # healthcheck, quem posta no Telegram sobe do mesmo jeito — o código
      # Python já trata WhatsApp como best-effort.
      condition: service_started

services:
  evolution:
    image: atendai/evolution-api:v2.1.1
    container_name: bot_evolution
    restart: always
    ports:
      # Só no loopback do servidor. A porta 8080 serve o `/manager`, que
      # autentica com a MESMA chave que dá poder de enviar mensagem em nome
      # do WhatsApp do Daniel — deixá-la aberta na internet é publicar um
      # painel de controle do número dele. Para escanear o QR, use um túnel
      # SSH a partir do seu computador (o README mostra o comando).
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: sqlite
      DATABASE_CONNECTION_URI: "file:./evolution.db"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_REDIS_ENABLED: "false"
      QRCODE_LIMIT: "30"
      LOG_LEVEL: WARN
      LANGUAGE: pt-BR
      DEL_INSTANCE: "false"
      TEMP_KEY_TTL: "3600"
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - evolution_data:/evolution/instances
      - evolution_store:/evolution/store
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  rastreador:
    <<: *bot
    container_name: bot_rastreador
    environment:
      <<: *bot-env
      # 0.0.0.0 DENTRO do container (a rede do container é isolada; em
      # 127.0.0.1 o `ports:` abaixo publicaria uma porta morta — era o caso
      # da versão anterior deste arquivo, que mapeava 8724 sem nunca
      # conseguir responder). Quem limita a exposição é o mapeamento, que
      # prende a porta ao loopback do servidor.
      HEALTHCHECK_BIND: 0.0.0.0
    volumes:
      - rastreador_data:/app/data
      - ../.git:/app/.git:ro
      # O site (GitHub Pages) é gerado por `export_json.py` a partir do
      # banco. Com o banco dentro de um volume Docker, o `docs/` do
      # repositório precisa estar visível aqui para o servidor conseguir
      # atualizar o site — ver `deploy/publicar_site.sh`.
      - ../docs:/app/docs
    ports:
      - "127.0.0.1:8724:8724"

  rastreador_amazon:
    <<: *bot
    container_name: bot_rastreador_amazon
    command: ["python", "-u", "rastreador_amazon.py", "--random", "--loop-min", "45", "--loop-max", "75"]

  campanha_ferramentas:
    <<: *bot
    container_name: bot_campanha_ferramentas
    command: ["python", "-u", "campanha_ferramentas.py", "--loop", "15"]

  # Fila de envio do WhatsApp com intervalo aleatório de 30-45 min — desacopla
  # o WhatsApp do Telegram (que continua imediato). Compartilha o mesmo volume
  # (banco SQLite em WAL) dos outros 3, que só ENFILEIRAM; este é o único que
  # consome a fila e fala com a Evolution API.
  whatsapp_queue:
    <<: *bot
    container_name: bot_whatsapp_queue
    command: ["python", "-u", "whatsapp_queue_sender.py"]

volumes:
  evolution_data:
  evolution_store:
  rastreador_data:
