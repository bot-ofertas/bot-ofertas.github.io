name: Bot Ofertas ML

on:
  schedule:
    # Só roda enquanto o PC local fica desligado. O cron é ESTÁTICO (o GitHub
    # não sabe ler core/janela.py), então ele é só o filtro grosseiro — quem
    # decide de verdade é o passo "Confirmar que o PC local está dormindo",
    # que pergunta ao core/janela.py, a mesma fonte que o Agendador de
    # Tarefas e o watchdog do n8n usam.
    #
    # Por que a confirmação em runtime importa: o desligamento das 02:00
    # ESPERA até 35 min se o bot estiver no meio de uma rodada
    # (aguardar_e_desligar.ps1), então o PC pode seguir publicando até
    # ~02:35 — bem em cima da rodada da nuvem das 02:00 BRT. Os dois bancos
    # de deduplicação são separados (o da nuvem é um cache do Actions), então
    # a sobreposição publica a MESMA oferta duas vezes no canal.
    #
    # Reduzido de 3x/hora pra 1x/hora em 2026-08-09: a organizacao foi
    # sinalizada pelo GitHub por atividade automatizada excessiva. A politica
    # oficial (docs.github.com/en/site-policy/acceptable-use-policies) cita
    # agendamento de hora em hora como o limiar onde sistemas automatizados
    # comecam a classificar como "resource abuse" -- rodar a cada 20min
    # (3x/hora) estava bem dentro dessa zona de risco.
    - cron: '0 5-11 * * *'   # ~02:00-08:00 BRT, 1x/hora
  workflow_dispatch:  # permite rodar manualmente no GitHub

permissions:
  contents: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Restaurar banco de dados (deduplicação)
        # Em cache-miss, mantém o DB versionado no repo (seed com histórico).
        uses: actions/cache@v4
        with:
          path: data/bot_ofertas.db
          key: sqlite-db-v2-${{ github.run_number }}
          restore-keys: |
            sqlite-db-v2-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Confirmar que o PC local está dormindo
        # Vem ANTES de instalar dependências e o Chromium de propósito: se a
        # janela mudou, a rodada inteira é pulada em segundos em vez de gastar
        # minutos para descobrir no fim que não devia publicar.
        #
        # HORA_LIGAR/HORA_DESLIGAR vêm das variáveis do repositório quando
        # existirem (Settings → Secrets and variables → Variables). Vazias, o
        # core/janela.py cai nos padrões 08:30/02:00 — os mesmos do .env do
        # PC. Assim mudar o horário do ciclo não deixa a nuvem para trás
        # publicando por cima do PC ligado.
        id: janela
        env:
          HORA_LIGAR: ${{ vars.HORA_LIGAR }}
          HORA_DESLIGAR: ${{ vars.HORA_DESLIGAR }}
          TZ: America/Sao_Paulo
        run: |
          if python -m core.janela --pc-ativo; then
            echo "O PC local deveria estar ligado agora — pulando para nao publicar duas vezes."
            python -m core.janela
            echo "pular=1" >> "$GITHUB_OUTPUT"
          else
            echo "PC local fora da janela — a nuvem publica."
            echo "pular=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências
        if: steps.janela.outputs.pular != '1'
        run: pip install -r requirements.txt

      - name: Instalar Playwright + Chromium
        if: steps.janela.outputs.pular != '1'
        run: python -m playwright install chromium --with-deps

      - name: Criar diretórios necessários
        if: steps.janela.outputs.pular != '1'
        run: mkdir -p data assets

      - name: Testes (qualidade, afiliado, quarentena, n8n)
        if: steps.janela.outputs.pular != '1'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_qualidade.py
          python tests/test_n8n_integracao.py

      - name: Gerar banner ALERTA CUPOM
        if: steps.janela.outputs.pular != '1'
        run: python -m core.banner_cupom
        continue-on-error: true   # não trava o build se Pillow tiver problema

      - name: Rodar o bot (Mercado Livre)
        if: steps.janela.outputs.pular != '1'
        env:
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          CANAL_GERAL: ${{ secrets.CANAL_GERAL }}
          ML_AFFILIATE_TOOL_ID: ${{ secrets.ML_AFFILIATE_TOOL_ID }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # n8n: as rodadas da nuvem (janela em que o PC fica desligado)
          # também empurram eventos, senão o painel e o relatório diário
          # ficariam cegos justamente na madrugada. Secrets opcionais —
          # sem eles a integração vira no-op, como no PC.
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_TOKEN: ${{ secrets.N8N_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python rastreador.py

      - name: Rodar cupons Amazon (se configurado)
        if: steps.janela.outputs.pular != '1'
        env:
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          CANAL_GERAL: ${{ secrets.CANAL_GERAL }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_TOKEN: ${{ secrets.N8N_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ -n "$AMAZON_AFFILIATE_TAG" ]; then
            python rastreador_amazon.py
          else
            echo "AMAZON_AFFILIATE_TAG nao configurada — pulando Amazon."
          fi
        continue-on-error: true   # Amazon não bloqueia o ML

      - name: Salvar banco atualizado no cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/bot_ofertas.db
          key: sqlite-db-v2-${{ github.run_number }}

      - name: Atualizar site (GitHub Pages)
        if: success() && steps.janela.outputs.pular != '1'
        env:
          PYTHONIOENCODING: utf-8
        run: python export_json.py

      - name: Commitar ofertas no site
        if: success() && steps.janela.outputs.pular != '1'
        run: |
          git config user.name "Bot-Ofertas"
          git config user.email "bot@github.com"
          git add docs/data/offers.json docs/ofertas/ docs/sitemap.xml docs/robots.txt
          git diff --cached --quiet || git commit -m "chore: atualiza ofertas do site [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
