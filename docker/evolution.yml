services:
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: bot_evolution_api
    restart: unless-stopped
    ports:
      # Loopback SO. Esta porta serve o /manager da Evolution, que autentica
      # com a MESMA chave que envia mensagem pelo numero do Daniel: publicada
      # para fora, e um painel de controle do WhatsApp dele para quem achar o
      # IP (Regra 16). Para acessar de outra maquina, tunel SSH:
      #   ssh -L 8080:127.0.0.1:8080 usuario@servidor
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      # SEM VALOR PADRAO, de proposito. O padrao anterior era uma chave
      # FIXA escrita neste arquivo, num repositorio PUBLICO: quem subisse a
      # pilha sem definir a variavel ficava com uma chave que qualquer um le
      # no GitHub — e essa chave autentica o envio de mensagem pelo numero do
      # Daniel (Regra 16). Agora o `docker compose` recusa subir e diz o que
      # fazer. Gere a sua com:
      #   python -c "import secrets; print(secrets.token_hex(16))"
      AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}'
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: sqlite
      DATABASE_CONNECTION_URI: "file:./evolution.db"
      DATABASE_CONNECTION_CLIENT_NAME: evolution

      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      WEBSOCKET_ENABLED: "false"
      QRCODE_LIMIT: "30"

      LOG_LEVEL: WARN
      LANGUAGE: pt-BR

      DEL_INSTANCE: "false"
      TEMP_KEY_TTL: "3600"

    volumes:
      - evolution_data:/evolution/instances
      - evolution_store:/evolution/store

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  evolution_data:
  evolution_store:
