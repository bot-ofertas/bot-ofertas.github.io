# n8n self-hosted para o Bot Ofertas
#
# Use este arquivo se você prefere rodar o n8n na sua própria máquina/VPS em
# vez do n8n.cloud. A diferença prática: aqui o n8n CONSEGUE alcançar o
# healthcheck do bot (via host.docker.internal), então o workflow 05
# (comandos remotos) funciona sem túnel nenhum.
#
#   docker compose -f n8n/docker-compose.n8n.yml up -d
#   → abra http://localhost:5678 e crie a conta de administrador
#   → Settings → n8n API → Create an API key
#   → coloque a chave em N8N_API_KEY no .env do bot
#   → python n8n/setup_n8n.py --importar
#
# Variáveis lidas de n8n/.env.n8n (copie de .env.n8n.example).

services:
  n8n-db:
    image: postgres:16-alpine
    container_name: bot-ofertas-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em n8n/.env.n8n}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      # O n8n falha ao subir se o Postgres ainda não aceita conexão; o
      # depends_on abaixo só espera de verdade por causa deste healthcheck.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: bot-ofertas-n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"   # só loopback: nada do n8n exposto na rede
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Chave que cifra as credenciais no banco. PERDER ESTA CHAVE = perder
      # todas as credenciais salvas (o n8n não consegue mais decifrá-las).
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY em n8n/.env.n8n}

      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

      # URL pública usada para montar os endereços de webhook. Em rede local
      # deixe como está; atrás de domínio/túnel, aponte para o endereço real,
      # senão os webhooks nascem com uma URL que ninguém alcança.
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Sem isso, execuções antigas enchem o disco em poucas semanas.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"     # 14 dias
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      # É isto que permite ao n8n chamar o healthcheck do bot rodando no
      # HOST (http://host.docker.internal:8724). Sem esta linha, "localhost"
      # dentro do contêiner é o próprio contêiner e a chamada morre.
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
  n8n_db:
